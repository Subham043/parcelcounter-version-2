[supervisord]
nodaemon=true
logfile=/var/www/storage/logs/supervisord_%(ENV_PROCESS)s.log
pidfile=/var/www/storage/logs/supervisord_%(ENV_PROCESS)s.pid

[program:php]
command=/bin/sh -c "%(ENV_COMMAND)s"
directory=/var/www/
startretries=20
stdout_logfile=/var/www/storage/logs/%(ENV_PROCESS)s.log
stderr_logfile=/var/www/storage/logs/%(ENV_PROCESS)s_error.log
autorestart=true
startsecs=5

[program:octane]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan octane:start --server=swoole --host=0.0.0.0 --port=8000
autostart=true
autorestart=true
# user=${UID}:${GID}
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/octane.log
stopwaitsecs=3600